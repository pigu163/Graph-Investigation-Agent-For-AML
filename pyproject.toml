[project]
name = "graph-investigation-agent-for-aml"
version = "0.1.0"
description = "Evidence-grounded AML transaction investigation"
readme = "README.md"
authors = [
    { name = "pigu163" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langgraph>=1.2.17",
    "networkx>=3.7",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
streaming = [
    "confluent-kafka>=2.8",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
