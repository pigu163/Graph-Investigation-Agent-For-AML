[project]
name = "graph-investigation-agent-for-aml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pigu163" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langgraph>=1.2.17",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
streaming = [
    "confluent-kafka>=2.8",
]

[project.scripts]
graph-investigation-agent-for-aml = "graph_investigation_agent_for_aml:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
